    <rect x="186" y="266" width="228" height="182" fill="url(#lumiere)" opacity=".35"/>
    <!-- tiroirs -->

      <rect x="196" y="334" width="208" height="50" rx="2"/>
      <rect x="196" y="392" width="208" height="48" rx="2"/>
