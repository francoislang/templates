  </defs>
  <ellipse class="pose" cx="300" cy="484" rx="230" ry="22" fill="url(#ombre-g)"/>
  <rect x="100" y="478" width="400" height="140" fill="url(#socle-g)"/>
  <rect x="100" y="478" width="400" height="4" fill="#fff" opacity=".5"/>

  <g data-p=".6"><g class="pose" style="--d:.5s">

      <path d="M116 450h60" stroke="#8C8A84" stroke-width="1" opacity=".6"/>

    <rect x="200" y="452" width="290" height="16" rx="2" fill="url(#hetre-g)"/>

    <rect x="222" y="244" width="40" height="208" rx="3" fill="url(#hetre-g)" filter="url(#grain-f)"/>

    <rect x="222" y="244" width="40" height="208" rx="3" fill="url(#lumiere)" opacity=".4"/>

    <path d="M214 236c-20 6-30 30-28 70 2 46 6 92 22 132 12-6 24-4 34 2-8-40-14-82-14-124 0-34 4-60 16-80z" fill="#1B1A18"/>
    <path d="M200 270c-4 50 0 110 14 160M216 248c-6 40-4 100 6 170" stroke="#3A3835" stroke-width="2" fill="none" opacity=".8"/>
    <!-- soufflet -->
    <path d="M262 262L392 304V410L262 440z" fill="url(#ph-soufflet)"/>
    <g stroke="#55504A" stroke-width="2" fill="none">
      <path d="M278 267v168M294 272v159M310 277v150M326 282v141M342 287v132M358 292v123M374 297v115"/>

    <rect x="390" y="290" width="30" height="162" rx="3" fill="url(#hetre-g)" filter="url(#grain-f)"/>
    <rect x="390" y="290" width="30" height="162" rx="3" fill="url(#lumiere)" opacity=".4"/>
    <!-- objectif -->
    <rect x="420" y="326" width="38" height="56" fill="url(#laiton-g)"/>
    <rect x="458" y="332" width="14" height="44" fill="url(#noir-g)"/>
    <ellipse cx="472" cy="354" rx="8" ry="22" fill="#2A2724"/>
    <ellipse cx="473" cy="354" rx="6" ry="17" fill="url(#ph-verre)"/>
    <path d="M471 342c2-3 3-3 4 0" stroke="#fff" stroke-width="2" stroke-linecap="round" class="lueur" fill="none"/>
    <!-- molettes -->
    <g fill="url(#laiton-g)"><circle cx="242" cy="460" r="6"/><circle cx="405" cy="460" r="6"/><circle cx="405" cy="300" r="5"/><circle cx="242" cy="252" r="5"/></g>
  </g></g>

  <!-- l'éclair du déclenchement -->
  <rect class="eclair" x="0" y="0" width="600" height="600" fill="url(#ph-flash)"/>
</svg>
