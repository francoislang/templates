<svg class="illus" viewBox="90 80 420 520" preserveAspectRatio="xMidYMax meet" role="img" aria-label="Une œuvre encadrée sous passe-partout, dans une baguette dorée, posée sur un chevalet de table ; devant, des coins d'échantillon de baguettes et une équerre.">

    <path d="M166 118l20 20M434 118l-20 20M166 438l20-20M434 438l-20-20" stroke="#5A4218" stroke-width="1.4" opacity=".7"/>

    <rect x="221" y="173" width="158" height="190" fill="#FBFAF6"/>

    <g clip-path="url(#en-vitre)">
      <path d="M200 152l60 0-60 90z" fill="#fff" opacity=".18"/>
      <rect class="balaye" x="40" y="140" width="60" height="280" fill="url(#eclat-g)" transform="skewX(-20)" style="--course:420px"/>

    <rect x="150" y="448" width="300" height="5" fill="#5E4630"/>
